[test]
coverage = true
# Gate aplicado por arquivo. Linhas e statements ficam estritos; o metrica de funcoes e mais
# frouxa porque componentes JSX, inicializadores de parametro default e callbacks inline contam
# como funcoes que nenhum teste unitario alcanca.
coverageThreshold = { lines = 0.9, functions = 0.8, statements = 0.9 }
coverageReporter = ["text", "lcov"]
# Infra de teste e o bootstrap do processo (abre porta e SQLite reais) ficam fora do gate;
# ambos sao exercitados pelos smokes documentados (CLI, API, container).
coverageSkipTestFiles = true
coveragePathIgnorePatterns = ["src/index.ts", "tests/**"]
