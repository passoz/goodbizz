services:
  goodbizz:
    build: .
    image: goodbizz:local
    ports:
      - "3000:3000"
    environment:
      LLM_API_URL: ${LLM_API_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_MODEL: ${LLM_API_MODEL:-gpt-4o-mini}
      DECISION_API_URL: ${DECISION_API_URL:-}
      DECISION_API_KEY: ${DECISION_API_KEY:-}
      DECISION_API_MODEL: ${DECISION_API_MODEL:-systemone-latest}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-session-secret-change-me-32b}
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GOODBIZZ_MOCK: ${GOODBIZZ_MOCK:-1}
      DATABASE_URL: /app/data/app.db
      GOODBIZZ_STUDIES_DIR: /app/data/estudos
    volumes:
      - goodbizz-data:/app/data
    restart: unless-stopped

volumes:
  goodbizz-data:
